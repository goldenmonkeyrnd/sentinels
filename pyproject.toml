[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "goldenmonkey-sentinels"
version = "0.1.0"
description = "Source-only, inspectable integration checks for Python applications"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{name = "Pauline Yeary"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "pydantic==2.12.5",
  "pydantic-core==2.41.5",
  "annotated-types==0.7.0",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
]

[project.scripts]
sentinels = "sentinels.cli:main"

[project.urls]
Homepage = "https://goldenmonkey.dev/work/agentic-engineering/"
Repository = "https://github.com/goldenmonkeyrnd/sentinels"
Issues = "https://github.com/goldenmonkeyrnd/sentinels/issues"

[project.optional-dependencies]
adapters = ["prefect==3.6.11", "typer==0.20.0"]

[dependency-groups]
dev = ["build>=1.3,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/sentinels"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "lab", "scripts", "pyproject.toml", "README.md", "LICENSE", "NOTICE", "uv.lock"]
