name: Check
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --extra adapters
      - run: uv run --locked --extra adapters python -m unittest discover -s tests -v
      - run: uv run --locked --extra adapters python scripts/export_schemas.py
      - run: git diff --exit-code -- docs/schemas
      - run: uv build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - run: uv sync --locked --extra adapters
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
