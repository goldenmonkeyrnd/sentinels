name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: sentinels-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - run: uv build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  native:
    name: Qualify Python ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-distributions
          path: dist
      - run: uv sync --locked --extra adapters
      - run: uv run --locked --extra adapters python scripts/qualify_native.py --output dist/native-${{ matrix.python }}.json
      - run: uv run --locked --extra adapters python scripts/export_schemas.py
      - run: git diff --exit-code -- docs/schemas
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.python }}
          path: dist/native-${{ matrix.python }}.json
          if-no-files-found: error

  browser:
    name: Qualify browser
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.14'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: python-distributions
          path: dist
      - run: uv sync --locked --extra adapters
      - run: bun install --frozen-lockfile
      - run: uv run --locked --extra adapters python scripts/export_browser_corpus.py
      - run: bun run build:lab
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-qualified
          path: |
            dist/sentinels-lab-*.tar.gz
            dist/browser-qualification.json
            dist/lab/assets-manifest.json
            dist/lab/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error

  publish:
    name: Publish qualified release
    needs: [native, browser]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: qualification-artifacts
      - name: Seal qualification and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_release.py --artifacts qualification-artifacts
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: promotion-token
        with:
          app-id: ${{ vars.SENTINELS_PROMOTION_APP_ID }}
          private-key: ${{ secrets.SENTINELS_PROMOTION_APP_PRIVATE_KEY }}
          owner: goldenmonkeyrnd
          repositories: golden-monkey-rnd
          permission-actions: write
      - name: Dispatch website qualification
        env:
          GH_TOKEN: ${{ steps.promotion-token.outputs.token }}
        run: python3 scripts/publish_release.py --dispatch-only
